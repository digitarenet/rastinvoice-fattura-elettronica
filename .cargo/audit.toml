#
# Avvisi di sicurezza esaminati e non applicabili a RastInvoice.
[advisories]
ignore = [
    # rsa 0.9, attacco Marvin: riguarda le operazioni con la chiave privata
    # (decifratura). RastInvoice usa RSA solo per verificare firme con chiavi
    # pubbliche, quindi non c'è alcun segreto da esporre.
    "RUSTSEC-2023-0071",
    # crypto-bigint 0.5 (tramite p256), tempi non costanti: anche qui il
    # problema riguarda i segreti; la verifica ECDSA usa solo dati pubblici.
    "RUSTSEC-2026-0387",
]
