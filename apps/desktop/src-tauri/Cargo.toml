[package]
name = "rustinvoice-desktop"
description = "Applicazione desktop RastInvoice: visualizzatore di fatture elettroniche"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
name = "rustinvoice_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rustinvoice-core = { path = "../../../crates/rustinvoice-core" }
rustinvoice-render = { path = "../../../crates/rustinvoice-render" }
rustinvoice-xslt = { path = "../../../crates/rustinvoice-xslt" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
walkdir.workspace = true
rust_decimal.workspace = true
chrono = { workspace = true, features = ["clock"] }
rayon = "1.10"
ureq = "3"
zip.workspace = true
calamine.workspace = true
encoding_rs.workspace = true

# Aggiornamento integrato solo su Linux (AppImage, .deb, .rpm scaricati da GitHub):
# su Windows e macOS gli aggiornamenti li gestiscono gli store.
[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-updater = "2"

# Segnalibri di sicurezza per la sandbox del Mac App Store (vedi src/segnalibri.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSError", "NSString", "NSURL"] }

[features]
# Predefinita: l'interfaccia compilata (cartella dist) è inclusa nell'eseguibile,
# così `cargo run` e il pulsante Run dell'IDE funzionano senza server di sviluppo.
# `npm run app:dev` la disattiva per usare il server Vite con ricarica automatica.
default = ["interfaccia-inclusa"]
interfaccia-inclusa = ["tauri/custom-protocol"]
