#
# Pacchetto Snap per lo Snap Store (vedi README.md). Da copiare in
# snap/snapcraft.yaml nella radice del repository prima di eseguire snapcraft.
name: rastinvoice
base: core22
version: '1.1.0'
title: RastInvoice
summary: Visualizzatore di fatture elettroniche XML e P7M
description: |
  RastInvoice è un visualizzatore gratuito e open source di fatture elettroniche
  italiane in formato FatturaPA: file XML, P7M firmati, archivi ZIP ed email
  PEC. Verifica firma e calcoli, tiene l'archivio di fatture emesse e ricevute
  con ricerca, rubrica e statistiche. Funziona senza connessione a Internet.
license: EUPL-1.2
website: https://github.com/digitarenet/rastinvoice-fattura-elettronica
source-code: https://github.com/digitarenet/rastinvoice-fattura-elettronica
contact: info@digitare.net
grade: stable
confinement: strict
icon: apps/desktop/src-tauri/icons/128x128@2x.png

apps:
  rastinvoice:
    command: usr/bin/rastinvoice
    desktop: usr/share/applications/net.digitare.rastinvoice.desktop
    extensions: [gnome]
    plugs:
      - home
      - removable-media
      - network
      - desktop

parts:
  rastinvoice:
    plugin: nil
    source: .
    build-packages:
      - curl
      - build-essential
      - libwebkit2gtk-4.1-dev
      - libssl-dev
      - librsvg2-dev
    stage-packages:
      - libwebkit2gtk-4.1-0
    override-build: |
      # Rust e Node.js aggiornati (quelli di Ubuntu 22.04 sono troppo vecchi)
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      . "$HOME/.cargo/env"
      curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
      apt-get install -y nodejs
      cd apps/desktop && npm ci && npm run build && cd ../..
      cargo build --release -p rustinvoice-desktop
      install -Dm755 target/release/rustinvoice-desktop $CRAFT_PART_INSTALL/usr/bin/rastinvoice
      install -Dm644 store/linux/net.digitare.rastinvoice.desktop $CRAFT_PART_INSTALL/usr/share/applications/net.digitare.rastinvoice.desktop
      sed -i 's|^Icon=.*|Icon=${SNAP}/meta/gui/icon.png|' $CRAFT_PART_INSTALL/usr/share/applications/net.digitare.rastinvoice.desktop
