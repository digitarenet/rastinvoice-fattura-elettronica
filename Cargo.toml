# Workspace principale di RastInvoice (nome provvisorio).

[workspace]
resolver = "2"
members = [
    "crates/rustinvoice-core",
    "crates/rustinvoice-render",
    "crates/rustinvoice-cli",
    "crates/rustinvoice-xslt",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.10.2"
edition = "2021"
authors = ["Andrea Re <info@digitare.net>"]
rust-version = "1.88"
repository = "https://github.com/digitarenet/rust-in-voice"
license = "EUPL-1.2"

[workspace.dependencies]
roxmltree = "0.21"
encoding_rs = "0.8"
rust_decimal = { version = "1.36", features = ["serde-str"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
calamine = { version = "0.38", default-features = false, features = ["dates"] }
clap = { version = "4", features = ["derive"] }
walkdir = "2"
rsa = "0.9"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
