# Verifica: formattazione, analisi statica e test del nucleo, controllo dei
# tipi dell'interfaccia e vulnerabilità note nelle dipendenze.
# Si avvia solo a mano (scheda Actions > Verifica > Run workflow) per non
# consumare minuti a ogni push.
name: Verifica

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Cache delle dipendenze compilate: dalla seconda esecuzione molti minuti in meno.
      - uses: Swatinem/rust-cache@v2
      - name: Formattazione
        run: cargo fmt --all --check
      - name: Analisi statica
        run: cargo clippy -p rustinvoice-core -p rustinvoice-render -p rustinvoice-cli -p rustinvoice-xslt --all-targets -- -D warnings
      - name: Test
        run: cargo test -p rustinvoice-core -p rustinvoice-render -p rustinvoice-cli -p rustinvoice-xslt

  interfaccia:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # Vulnerabilità note nelle dipendenze Rust (RustSec) e JavaScript (npm).
  sicurezza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Eseguibile già compilato: evita alcuni minuti di compilazione.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Dipendenze Rust
        run: cargo audit
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Dipendenze JavaScript
        working-directory: apps/desktop
        run: npm audit --omit=dev --audit-level=high
