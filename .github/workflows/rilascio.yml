#
# Rilascio: solo su richiesta manuale (scheda Actions > Rilascio > Run
# workflow), compila l'applicazione per Windows, macOS e Linux e allega i pacchetti a
# una release in bozza su GitHub, da controllare e pubblicare a mano.
#
# Su Windows produce anche il pacchetto MSIX per il Microsoft Store se nel
# repository sono definite le variabili MSIX_NOME_PACCHETTO, MSIX_EDITORE e
# MSIX_EDITORE_VISUALIZZATO (valori presi da Partner Center).
name: Rilascio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pacchetti:
    strategy:
      fail-fast: false
      matrix:
        include:
          - piattaforma: windows-latest
            nome: windows-x64
          - piattaforma: macos-latest
            nome: macos-universale
            argomenti: --target universal-apple-darwin
          - piattaforma: ubuntu-22.04
            nome: linux-x64
    runs-on: ${{ matrix.piattaforma }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Su macOS si produce un'unica app per processori Intel e Apple.
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Librerie di sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Dipendenze dell'interfaccia
        working-directory: apps/desktop
        run: npm ci

      # Firma e notarizzazione Apple: attive solo se i segreti sono presenti
      # (vedi store/apple/README.md). Senza segreti il dmg non è firmato.
      - name: Firma Apple (facoltativa)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then echo "Segreti Apple assenti: dmg non firmato"; exit 0; fi
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            echo "$v=${!v}" >> "$GITHUB_ENV"
          done

      - name: Compilazione e pacchetti
        working-directory: apps/desktop
        run: npx tauri build ${{ matrix.argomenti }}

      - name: Versione
        id: versione
        shell: bash
        run: echo "valore=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      # Versione portatile: eseguibile più cartella `dati` vuota, così i dati
      # restano accanto al programma (anche su chiavetta USB).
      - name: Versione portatile (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cartella = "target/portatile/RastInvoice"
          New-Item -ItemType Directory -Force -Path "$cartella/dati" | Out-Null
          Copy-Item target/release/rustinvoice-desktop.exe "$cartella/RastInvoice.exe"
          Copy-Item LICENSE* $cartella -ErrorAction SilentlyContinue
          Compress-Archive -Path $cartella -DestinationPath "target/portatile/RastInvoice_${{ steps.versione.outputs.valore }}_windows-x64_portatile.zip"

      - name: Pacchetto MSIX (Windows)
        if: runner.os == 'Windows' && vars.MSIX_NOME_PACCHETTO != ''
        shell: pwsh
        run: >
          ./scripts/msix.ps1
          -NomePacchetto "${{ vars.MSIX_NOME_PACCHETTO }}"
          -Editore "${{ vars.MSIX_EDITORE }}"
          -EditoreVisualizzato "${{ vars.MSIX_EDITORE_VISUALIZZATO }}"

      - name: Release in bozza
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.versione.outputs.valore) }}
          name: RastInvoice ${{ steps.versione.outputs.valore }}
          files: |
            target/release/bundle/nsis/*.exe
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/portatile/*.zip
            target/msix/*.msix
          fail_on_unmatched_files: false
