#
# Rilascio: solo su richiesta manuale (scheda Actions > Rilascio > Run workflow).
#
# Distribuzione scelta:
# - Linux: pacchetti .deb, .rpm e AppImage allegati a una release in bozza su
#   GitHub, da controllare e pubblicare a mano.
#   Aggiornamento integrato: se nel repository ci sono il segreto
#   CHIAVE_PRIVATA_AGGIORNAMENTI (con PASSWORD_CHIAVE_AGGIORNAMENTI, se la
#   chiave ha una password) e la variabile CHIAVE_PUBBLICA_AGGIORNAMENTI, i
#   pacchetti vengono firmati e alla release si aggiunge latest.json, che le
#   versioni già installate leggono per aggiornarsi. La coppia di chiavi si
#   crea una volta sola con `npx tauri signer generate`; senza chiavi i
#   pacchetti funzionano ma si aggiornano solo scaricandoli dalla release.
# - Windows: solo Microsoft Store. Il pacchetto MSIX non va nella release ma
#   tra i file del workflow ("Artifacts"), da caricare in Partner Center.
#   Serve che nel repository siano definite le variabili MSIX_NOME_PACCHETTO,
#   MSIX_EDITORE e MSIX_EDITORE_VISUALIZZATO (valori presi da Partner Center).
# - macOS: solo Mac App Store, con una procedura a parte (store/apple/README.md).
name: Rilascio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Librerie di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Dipendenze dell'interfaccia
        working-directory: apps/desktop
        run: npm ci

      - name: Compilazione e pacchetti
        working-directory: apps/desktop
        env:
          RASTINVOICE_CHIAVE_AGGIORNAMENTI: ${{ vars.CHIAVE_PUBBLICA_AGGIORNAMENTI }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.CHIAVE_PRIVATA_AGGIORNAMENTI }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.PASSWORD_CHIAVE_AGGIORNAMENTI }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$RASTINVOICE_CHIAVE_AGGIORNAMENTI" ]; then
            echo "Pacchetti firmati per l'aggiornamento integrato"
            npx tauri build --bundles deb,rpm,appimage --config '{"bundle":{"createUpdaterArtifacts":true}}'
            echo "FIRMATI=si" >> "$GITHUB_ENV"
          else
            echo "::warning::Chiavi di aggiornamento assenti: pacchetti senza aggiornamento integrato"
            unset RASTINVOICE_CHIAVE_AGGIORNAMENTI TAURI_SIGNING_PRIVATE_KEY
            npx tauri build --bundles deb,rpm,appimage
          fi

      - name: Versione
        id: versione
        run: echo "valore=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: File per l'aggiornamento integrato
        if: env.FIRMATI == 'si'
        run: >
          node store/linux/manifesto-aggiornamenti.mjs
          "${{ steps.versione.outputs.valore }}"
          "https://github.com/${{ github.repository }}/releases/download/v${{ steps.versione.outputs.valore }}"
          > target/release/bundle/latest.json

      - name: Release in bozza
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: v${{ steps.versione.outputs.valore }}
          name: RastInvoice ${{ steps.versione.outputs.valore }}
          files: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/latest.json

  microsoft-store:
    if: vars.MSIX_NOME_PACCHETTO != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Dipendenze dell'interfaccia
        working-directory: apps/desktop
        run: npm ci

      # Solo l'eseguibile: l'installer non serve, il pacchetto è l'MSIX.
      - name: Compilazione
        working-directory: apps/desktop
        run: npx tauri build --no-bundle

      - name: Pacchetto MSIX
        shell: pwsh
        run: >
          ./store/microsoft/msix.ps1
          -NomePacchetto "${{ vars.MSIX_NOME_PACCHETTO }}"
          -Editore "${{ vars.MSIX_EDITORE }}"
          -EditoreVisualizzato "${{ vars.MSIX_EDITORE_VISUALIZZATO }}"

      - name: Pacchetto per Partner Center
        uses: actions/upload-artifact@v4
        with:
          name: msix
          path: target/msix/*.msix
          retention-days: 14
